version: 2
sources:
  - name: jaffle_shop
    database: dbt_tutorial
    schema: jaffle_shop
    tables:
      - name: raw_customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: raw_orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                 arguments:
                  values: ['completed', 'returned', 'pending', 'failed']
